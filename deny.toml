[graph]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]

[advisories]
yanked = "deny"
unmaintained = "all"
ignore = [
    # Remove when tabled_derive migrates away from proc-macro-error2.
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 is pulled in by the tabled development dependency via tabled_derive; no safe upgrade is available." },
]

[licenses]
include-dev = true
include-build = true
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "CC0-1.0",
    "MIT",
    "Unicode-3.0",
    "bzip2-1.0.6",
]

# Keep the project's license scoped to its own crates.
[[licenses.exceptions]]
name = "risearch"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
name = "risearch-python"
allow = ["GPL-3.0-only"]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
