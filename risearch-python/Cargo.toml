[package]
name = "risearch-python"
version.workspace = true
rust-version.workspace = true
edition = "2021"

[lib]
name = "risearch"
crate-type = ["cdylib"]

[dependencies]
risearch = { path = ".." }
anyhow = "1"
pyo3 = { version = "0.29.0", features = ["extension-module", "anyhow", "abi3-py310"] }
clap = { workspace = true }
arrow-array = { version = "59.1.0", features = ["ffi"] }
arrow-schema = "59.1.0"
