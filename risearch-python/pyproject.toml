[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name = "risearch"
dynamic = ["version"]
requires-python = ">=3.10"
description = "Python bindings for risearch RNA-RNA interaction search"
dependencies = ["polars>=1.0"]

[project.optional-dependencies]
lts-cpu = ["polars[rtcompat]>=1.43.0"]

[dependency-groups]
dev = ["pytest", "maturin"]

[tool.maturin]
module-name = "risearch._risearch"
