[build-system]
requires = ["maturin>=1.12.5,<2"]
build-backend = "maturin"

[project]
name = "risearch"
dynamic = ["version"]
requires-python = ">=3.10"
description = "Python bindings for risearch RNA-RNA interaction search"
readme = "README.md"
license = "GPL-3.0-only"
authors = [{ name = "Stefano Roncelli", email = "stefano.roncelli@sund.ku.dk" }]
keywords = ["RNA", "bioinformatics", "RNA-RNA interaction", "sequence-search", "suffix-array"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = ["polars>=1.43.2"]

[project.urls]
Repository = "https://github.com/saiden89/risearch"
Issues = "https://github.com/saiden89/risearch/issues"

[project.optional-dependencies]
lts-cpu = ["polars[rtcompat]>=1.43.0"]

[dependency-groups]
dev = ["pytest", "maturin>=1.12.5,<2"]

[tool.uv]
package = false

[tool.maturin]
python-source = "."
module-name = "risearch._native"
locked = true
