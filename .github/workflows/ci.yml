name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read


jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --locked --workspace --all-targets --features prof -- -D warnings

      - name: Build openmp feature
        run: cargo build --locked -p risearch --features openmp

      - name: docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps -p risearch --all-features

  actions-lint:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.88.0"

      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: cargo check on MSRV
        run: cargo check --locked --workspace --all-targets --all-features

  minimal-versions:
    name: Minimal versions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install cargo-minimal-versions
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-hack,cargo-minimal-versions

      # No --locked: the tool regenerates the lock down to the declared minimums.
      # --ignore-private: pyo3-log's floor in the unpublished binding crate would otherwise override this crate's own.
      - name: Check direct-minimal-versions
        run: cargo minimal-versions check --direct --no-dev-deps --ignore-private -p risearch

  test:
    name: Test ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: ubuntu }
          - { os: macos-latest, label: macOS }
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # C-oracle build deps: cmake (libdivsufsort), libpcre3-dev (-lpcre),
      # zlib1g-dev (-lz), build-essential (gcc/make).
      - name: Install C-oracle system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libpcre3-dev zlib1g-dev

      # Apple clang has no OpenMP, so the oracle needs a Homebrew GCC; pcre
      # supplies -lpcre. cmake and make ship with the runner image, and -lz
      # resolves against the SDK.
      - name: Install C-oracle system dependencies
        if: runner.os == 'macOS'
        run: brew install gcc pcre

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: nextest

      - name: Build C oracle
        run: bash .github/scripts/build-c-oracle.sh

      - name: Run tests
        run: cargo nextest run --locked --workspace --exclude risearch-python

      - name: Run doctests
        run: cargo test --locked --workspace --exclude risearch-python --doc

  test-python:
    name: Python suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # uv sync prunes packages it does not track, so it must precede maturin develop.
      - name: Build extension into the locked environment
        working-directory: bindings/python
        run: |
          uv sync --locked --python 3.10
          uv run --locked maturin develop

      - name: Run Python suite
        working-directory: bindings/python
        run: uv run --locked pytest -q
