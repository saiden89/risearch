name: Setup Rust
description: Install Rust toolchain and cache cargo build artifacts

inputs:
  toolchain:
    description: Rust toolchain channel or version
    default: stable
  components:
    description: Comma-separated rustup components
    default: ""

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}

    - name: Cache cargo build
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
