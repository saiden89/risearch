[workspace]
members = [".", "bindings/python"]
resolver = "3"

[workspace.package]
version = "3.0.0-alpha.1"
rust-version = "1.88"
edition = "2021"
license-file = "LICENSE"

[workspace.dependencies]
anyhow = "1.0.46"
clap = { version = "4", default-features = false, features = ["std", "help", "usage"] }

[package]
name = "risearch"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
description = "Fast RNA-RNA interaction search using suffix arrays and thermodynamic scoring"
repository = "https://github.com/saiden89/risearch"
readme = "README.md"
license = "GPL-3.0-only"
include = [
    "/src/**",
    "/benches/**",
    "/build.rs",
    "/data/dsm/**",
    "/README.md",
    "/LICENSE",
]

[features]
default = []
prof = []
openmp = ["libsais/openmp"]

[dependencies]
fs-err = "3"
anyhow.workspace = true
bytecheck = "0.8"
clap = { workspace = true, features = ["derive"] }
env_logger = { version = "0.11", features = ["color"] }
flate2 = { version = "1.0.30", default-features = false, features = ["zlib"] }
itoa = "1"
libsais = { version = "0.2", default-features = false }
log = { version = "0.4.8", features = ["release_max_level_info"] }
memmap2 = "0.9"
needletail = "0.7"
rayon = "1.5"
rkyv = { version = "0.8", features = ["bytecheck", "std", "pointer_width_64"] }
smallvec = "1"
tikv-jemallocator = "0.7"
toml_edit = "0.25"
zstd = "0.13.2"

[dev-dependencies]
approx = "0.5.1"
assert_cmd = "2.2.2"
criterion = { version = "0.8.2", features = ["html_reports"] }
predicates = "3.1.4"
pretty_assertions = "1.4.1"
tabled = "0.21.0"
tempfile = "3.27.0"
rstest = "0.26.1"
insta = "1.48.0"

[[bench]]
name = "format"
harness = false

[[bench]]
name = "dp"
harness = false

[[bench]]
name = "search"
harness = false

[[bench]]
name = "seed"
harness = false

[[bench]]
name = "output"
harness = false

[profile.profiling]
inherits = "release"
debug = 2
lto = false
split-debuginfo = "packed"

[profile.release]
debug = false
lto = "fat"
codegen-units = 1


[lints.rust]
unreachable_pub = "warn"

[build-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1"
