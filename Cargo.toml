[workspace]
members = [".", "bindings/python"]
resolver = "3"

[workspace.package]
version = "3.0.0-alpha.2"
rust-version = "1.88"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1.0.46"
clap = { version = "4", default-features = false, features = [
  "std",
  "help",
  "usage",
] }

[package]
name = "risearch"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
description = "Fast RNA-RNA interaction search using suffix arrays and thermodynamic scoring"
repository = "https://github.com/saiden89/risearch"
license.workspace = true
keywords = ["rna", "bioinformatics", "suffix-array", "alignment", "genomics"]
categories = ["science::bioinformatics", "command-line-utilities", "algorithms"]
include = [
  "/src/**",
  "/benches/**",
  "/build.rs",
  "/data/dsm/**",
  "/README.md",
  "/LICENSE",
]

[features]
default = []
prof = []
openmp = ["libsais/openmp"]

[dependencies]
anyhow.workspace = true
bytecheck = "0.8"
clap = { workspace = true, features = ["derive"] }
env_logger = { version = "0.11", features = ["color"] }
flate2 = { version = "1.0.30", default-features = false, features = ["zlib"] }
fs-err = "3"
itoa = "1"
libsais = { version = "0.2", default-features = false }
log = { version = "0.4.8", features = ["release_max_level_info"] }
memmap2 = "0.9"
mimalloc = "0.1.18"
needletail = "0.7"
rayon = "1.5"
rkyv = { version = "0.8", features = ["bytecheck", "std", "pointer_width_64"] }
smallvec = "1"
thiserror = "2.0.12"
toml_edit = "0.25"
zstd = "0.13.2"

[dev-dependencies]
approx = "0.5.1"
assert_cmd = "2.2.2"
criterion = { version = "0.8.2", features = ["html_reports"] }
predicates = "3.1.4"
pretty_assertions = "1.4.1"
proptest = "1.11"
rstest = "0.26.1"
tempfile = "3.27.0"

[[bench]]
name = "format"
harness = false

[[bench]]
name = "dp"
harness = false

[[bench]]
name = "search"
harness = false

[[bench]]
name = "seed"
harness = false

[[bench]]
name = "output"
harness = false

[profile.profiling]
inherits = "release"
debug = 2
lto = false
split-debuginfo = "packed"

[profile.release]
debug = false
lto = "fat"
codegen-units = 1

[profile.mutants]
inherits = "test"
debug = "none"


[lints.rust]
unreachable_pub = "warn"
missing_docs = "warn"

[build-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1"
