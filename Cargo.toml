[workspace]
members = [".", "risearch-python"]

[workspace.dependencies]
clap = { version = "4.5.54", default-features = false, features = ["std"] }

[package]
name = "risearch"
version = "3.0.0-alpha.1"
edition = "2021"

[features]
default = []
prof = []
openmp = ["libsais/openmp"]

[dependencies]
anyhow = "1.0"
bincode = "1.3.3"
bytecheck = "0.8"
clap = { workspace = true, features = ["derive"] }
env_logger = { version = "0.11", features = ["color"] }
flate2 = { version = "1.1.8", default-features = false, features = ["zlib"] }
itoa = "1.0"
libsais = { version = "0.2", default-features = false }
log = { version = "0.4", features = ["release_max_level_info"] }
memmap2 = "0.9"
needletail = "0.6.3"
rayon = "1.11"
rkyv = { version = "0.8", features = ["bytecheck", "std", "pointer_width_64"] }
serde = { version = "1.0.228", features = ["derive"] }
smallvec = "1.15.1"
tikv-jemallocator = "0.6"
zstd = "0.13"

[dev-dependencies]
approx = "0.5"
assert_cmd = "2.1.2"
criterion = { version = "0.5", features = ["html_reports"] }
predicates = "3.1.3"
pretty_assertions = "1.4"
tabled = "0.18"
tempfile = "3.24.0"
rstest = "0.24"

[[bench]]
name = "format"
harness = false

[[bench]]
name = "dp"
harness = false

[[bench]]
name = "search"
harness = false

[[bench]]
name = "seed"
harness = false

[[bench]]
name = "output"
harness = false

[profile.profiling]
inherits = "release"
debug = 2
lto = false
split-debuginfo = "packed"

[profile.release]
debug = false
lto = "fat"
codegen-units = 1


[lints.rust]
unreachable_pub = "warn"
